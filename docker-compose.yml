version: '3.8'

services:
  # PostgreSQL - local database for development and production
  postgres:
    image: postgres:16-alpine
    container_name: fabli-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fabli}
      POSTGRES_USER: ${POSTGRES_USER:-fabli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabli} -d ${POSTGRES_DB:-fabli}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fabli-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: fabli-app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - fabli-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: fabli-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./public/uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - fabli-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: fabli-certbot
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew > /dev/null 2>&1; sleep 12h & wait \$\${!}; done'"
    networks:
      - fabli-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fabli-network:
    driver: bridge
